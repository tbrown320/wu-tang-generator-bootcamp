<!DOCTYPE html>
<html lang="en">
	<head>
  	<meta charset="utf-8">
  	<meta name="description" content="Wu-Tang Name Generator">
  	<meta name="keywords" content="Wu-Tang Clan, name-generator, game">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		
		<title>Wu-Tang Name Generator</title>

		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
        <h1>Wu-Tang Name Generator!</h1>
        <p>Answer some questions about your personality and find out your Wu-Tang Clan name!</p>
        <section id="questions">
        <fieldset id="Q1">
            <legend>1. How do you handle a problem?</legend>
            <label><input type="radio" name="q1" value="1"> Think it through</label>
            <label><input type="radio" name="q1" value="2"> Talk it out</label>
            <label><input type="radio" name="q1" value="3"> Charge right in</label>
        </fieldset>
 
        <fieldset id="Q2">
            <legend>2. Favorite time of day:</legend>
            <label><input type="radio" name="q2" value="1"> Sunrise</label>
            <label><input type="radio" name="q2" value="2"> Afternoon</label>
            <label><input type="radio" name="q2" value="3"> Midnight</label>
        </fieldset>
 
        <fieldset id="Q3">
            <legend>3. What is your weapon of choice?:</legend>
            <label><input type="radio" name="q3" value="1"> Your words</label>
            <label><input type="radio" name="q3" value="2"> A wooden staff</label>
            <label><input type="radio" name="q3" value="3"> Your fists</label>
        </fieldset>
 
        <fieldset id="Q4">
            <legend>4. Pick an instrumental you would freestyle to:</legend>
            <label><input type="radio" name="q4" value="1"> Slow and smooth</label>
            <label><input type="radio" name="q4" value="2"> Head-knocker</label>
            <label><input type="radio" name="q4" value="3"> Heavy drums and bass</label>
        </fieldset>
 
        <fieldset id="Q5">
            <legend>5. Your crew says your role is:</legend>
            <label><input type="radio" name="q5" value="1"> The thinker</label>
            <label><input type="radio" name="q5" value="2"> The glue</label>
            <label><input type="radio" name="q5" value="3"> The wild card</label>
        </fieldset>

        <button>What's My Name!</button>
        </section>

        <section id="wu_results"></section>


		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
